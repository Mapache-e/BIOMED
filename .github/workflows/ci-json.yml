
name: CI - Validacion JSON

on:
  push:
    paths:
      - "config/**/*.json"
      - ".github/workflows/ci-json.yml"
  pull_request:
    paths:
      - "config/**/*.json"
      - ".github/workflows/ci-json.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar-json:
    runs-on: ubuntu-latest

    steps:
      - name: Obtener archivos de BIOMED
        uses: actions/checkout@v4

      - name: Validar sintaxis JSON
        shell: bash
        run: |
          set -e
          shopt -s globstar nullglob

          archivos=(config/**/*.json)

          if (( ${#archivos[@]} == 0 )); then
            echo "No se encontraron archivos JSON"
            exit 1
          fi

          for archivo in "${archivos[@]}"; do
            python3 -m json.tool "$archivo" > /dev/null
            echo "JSON valido: $archivo"
          done

          echo "Validacion JSON completada correctamente"
  
