name: QA - Pruebas Python BIOMED

on:
  push:
    paths:
      - "src/**"
      - "test/**"
      - "config/**"
      - ".github/workflows/qa-python.yml"
  pull_request:
    paths:
      - "src/**"
      - "test/**"
      - "config/**"
      - ".github/workflows/qa-python.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas-python:
    runs-on: ubuntu-latest

    steps:
      - name: Obtener archivos BIOMED
        uses: actions/checkout@v6

      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Ejecutar programa de validacion
        run: python src/validador_configuraciones.py

      - name: Ejecutar pruebas automaticas
        run: python -m unittest discover -s test -p "test_*.py" -v
